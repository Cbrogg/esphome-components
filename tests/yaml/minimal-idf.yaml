esphome:
  name: ble-adv-minimal-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [ble_adv_controller]

ble_adv_controller:
  - id: controller
    encoding: fanlamp_pro
    variant: v3
  - id: second_controller
    encoding: zhijia
    variant: v2
    forced_id: 0xC630B8

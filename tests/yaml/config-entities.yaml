esphome:
  name: ble-adv-config-entities

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [ble_adv_controller]

ble_adv_controller:
  - id: controller
    encoding: fanlamp_pro
    variant: v3
    show_config: true

  - id: hidden_config
    encoding: lampsmart_pro
    variant: v2
    show_config: false

light:
  - platform: ble_adv_controller
    name: Main Light
    ble_adv_controller_id: controller

esphome:
  name: light
  friendly_name: Light
  min_version: 2026.5.2

external_components:
  - source:
      type: local
      path: ../../components
    components: [ble_adv_controller]
  # Для прошивки без локального репозитория:
  # - source: github://Cbrogg/esphome-components
  #   components: [ble_adv_controller]

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

esp32_ble:
  advertising: false

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Light Fallback Hotspot"
    password: !secret ap_password

captive_portal:

ble_adv_controller:
  - id: kitchen_controller_1
    encoding: lampsmart_pro
    variant: v3
    duration: 200ms
    max_duration: 3s
    show_config: false

  - id: kitchen_controller_2
    encoding: lampsmart_pro
    variant: v3
    duration: 200ms
    max_duration: 3s
    show_config: false

  - id: bedroom_controller
    encoding: lampsmart_pro
    variant: v3
    duration: 200ms
    max_duration: 3s
    show_config: false

  - id: fan_light_controller
    encoding: fanlamp_pro
    variant: v3
    duration: 200ms
    max_duration: 3s
    show_config: false

light:
  - platform: ble_adv_controller
    id: kitchen_light_1
    name: "Кухня Люстра 1"
    ble_adv_controller_id: kitchen_controller_1
    min_brightness: 1%
    constant_brightness: false

  - platform: ble_adv_controller
    id: kitchen_light_2
    name: "Кухня Люстра 2"
    ble_adv_controller_id: kitchen_controller_2
    min_brightness: 1%
    constant_brightness: false

  - platform: ble_adv_controller
    id: bedroom_light
    name: "Спальня Люстра"
    ble_adv_controller_id: bedroom_controller
    min_brightness: 1%
    constant_brightness: false

  - platform: ble_adv_controller
    id: fan_light
    name: "Люстра с вентилятором"
    ble_adv_controller_id: fan_light_controller
    min_brightness: 1%
    constant_brightness: false

button:
  - platform: ble_adv_controller
    name: "Сопряжение Кухня 1"
    ble_adv_controller_id: kitchen_controller_1
    cmd: pair

  - platform: ble_adv_controller
    name: "Сопряжение Кухня 2"
    ble_adv_controller_id: kitchen_controller_2
    cmd: pair

  - platform: ble_adv_controller
    name: "Сопряжение Спальня"
    ble_adv_controller_id: bedroom_controller
    cmd: pair

  - platform: ble_adv_controller
    name: "Сопряжение Люстра с вентилятором"
    ble_adv_controller_id: fan_light_controller
    cmd: pair

fan:
  - platform: ble_adv_controller
    id: fan_light_fan
    name: "Вентилятор люстры"
    ble_adv_controller_id: fan_light_controller
    speed_count: 6
    use_direction: true
    use_oscillation: false
    forced_refresh_on_start: true

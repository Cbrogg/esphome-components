esphome:
  name: ble-adv-zhijia-fan

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [ble_adv_controller]

ble_adv_controller:
  - id: controller
    encoding: zhijia
    variant: v2

light:
  - platform: ble_adv_controller
    name: Main Light
    ble_adv_controller_id: controller
    separate_dim_cct: true

fan:
  - platform: ble_adv_controller
    name: Ceiling Fan
    ble_adv_controller_id: controller
    speed_count: 6
    use_direction: false
    use_oscillation: false
